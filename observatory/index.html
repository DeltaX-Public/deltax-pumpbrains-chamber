<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><title>PumpBrains Twin-Chamber Observatory</title>
<style>
body{font-family:system-ui;background:#0b1020;color:#e8ecf7;margin:0;padding:1rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.card{background:#141a2e;border:1px solid #243049;border-radius:12px;padding:1rem}
button{background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:.5rem .8rem;cursor:pointer}
pre{background:#0a0e1a;padding:1rem;border-radius:8px;overflow:auto;font-size:.75rem}
</style></head><body>
<h1>PumpBrains Twin-Chamber Observatory</h1>
<p>In-browser stub only (<code>executive_source=deltax_stub</code>). Not genuine DeltaX. Not a PumpBrains LIF clone.</p>
<p><button id="step">Step</button> <button id="reset">Reset</button></p>
<div class="grid" id="grid"></div>
<pre id="log">Ready.</pre>
<script type="module">
const BEH=['feeding','escape','walking','grooming','courtship','arousal'];
let state={step:0,chambers:Object.fromEntries(['CONTROL','OBSERVE','EXECUTIVE'].map(c=>[c,{behavior:Object.fromEntries(BEH.map(b=>[b,0.15])),executed:[]}])),modulation:{caution:0.5}};
function render(){document.getElementById('grid').innerHTML=['CONTROL','OBSERVE','EXECUTIVE'].map(c=>`<div class="card"><h2>${c}</h2>${BEH.map(b=>`<div>${b}: ${state.chambers[c].behavior[b].toFixed(2)}</div>`).join('')}</div>`).join('');}
document.getElementById('step').onclick=()=>{
  state.step++;
  for (const c of Object.values(state.chambers)){c.behavior.feeding=Math.min(1,c.behavior.feeding+0.1);c.executed.push({action_class:'feeding'});}
  document.getElementById('log').textContent=JSON.stringify({step:state.step,executive_source:'deltax_stub',genuine_deltax:false},null,2);
  render();
};
document.getElementById('reset').onclick=()=>{state.step=0;render();document.getElementById('log').textContent='Reset.';};
render();
</script></body></html>
